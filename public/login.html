<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar — Minhas Finanças</title>
<link rel="stylesheet" href="/style.css" />
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #141a2b; }
  .login-card {
    background: #fff; border-radius: 16px; padding: 32px 30px; width: 340px; max-width: 90vw;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  }
  .login-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; margin-bottom: 22px; }
  .login-brand .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: #2f6fed; box-shadow: 0 0 0 4px rgba(47,111,237,0.25); }
  .login-card input {
    width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid #e3e7ee; font-size: 14px; margin-bottom: 14px;
  }
  .login-card button {
    width: 100%; padding: 11px; border: none; border-radius: 8px; background: #2f6fed; color: #fff;
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .login-card button:hover { background: #1e4fc4; }
  .login-error { color: #d64545; font-size: 13px; margin: -8px 0 14px 0; display: none; }
  .login-error.show { display: block; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand"><span class="brand-dot"></span><span>Minhas Finanças</span></div>
    <p class="login-error" id="loginError">Senha incorreta. Tente novamente.</p>
    <form method="POST" action="/api/login">
      <input type="password" name="password" placeholder="Senha" autofocus required />
      <button type="submit">Entrar</button>
    </form>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("error")) {
      document.getElementById("loginError").classList.add("show");
    }
  </script>
</body>
</html>
