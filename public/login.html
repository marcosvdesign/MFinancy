<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar — MyFinance</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<script>
  (function () {
    try {
      // Mesmo padrao fixo (escuro) do app principal — ver index.html.
      var saved = localStorage.getItem("theme");
      var theme = saved || "dark";
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {}
  })();
</script>
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--sidebar-bg); }
  .login-card {
    background: var(--surface); color: var(--text); border-radius: 16px; padding: 32px 30px; width: 340px; max-width: 90vw;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  }
  .login-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; margin-bottom: 22px; }
  .login-brand .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 4px rgba(47,111,237,0.25); }
  .login-card input {
    width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--input-bg); color: var(--text); font-size: 14px; margin-bottom: 14px;
  }
  .login-card button {
    width: 100%; padding: 11px; border: none; border-radius: 8px; background: var(--primary); color: #fff;
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .login-card button:hover { background: var(--primary-dark); }
  .login-error { color: var(--red); font-size: 13px; margin: -8px 0 14px 0; display: none; }
  .login-error.show { display: block; }
  .login-signup-link { text-align: center; font-size: 13px; color: var(--text-muted, #8a93a6); margin-top: 16px; }
  .login-signup-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
  .login-signup-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand"><span class="brand-dot"></span><span>MyFinance</span></div>
    <p class="login-error" id="loginError">E-mail ou senha incorretos. Tente novamente.</p>
    <form method="POST" action="/api/login">
      <input type="email" name="email" placeholder="E-mail" autofocus required />
      <input type="password" name="password" placeholder="Senha" required />
      <button type="submit">Entrar</button>
    </form>
    <p class="login-signup-link">Ainda não tem conta? <a href="/signup">Cadastre-se</a></p>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("error")) {
      document.getElementById("loginError").classList.add("show");
    }
  </script>
</body>
</html>
