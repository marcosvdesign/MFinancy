<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Criar conta — MyFinance</title>
<link rel="icon" href="/favicon.png" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<script>
  (function () {
    try {
      // Mesmo padrao fixo (escuro) do app principal — ver index.html.
      var saved = localStorage.getItem("theme");
      var theme = saved || "dark";
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {}
  })();
</script>
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--sidebar-bg); }
  .login-card {
    background: var(--surface); color: var(--text); border-radius: 16px; padding: 32px 30px; width: 340px; max-width: 90vw;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  }
  .login-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; margin-bottom: 22px; }
  .login-brand img { width: 28px; height: 28px; }
  .login-card input {
    width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--input-bg); color: var(--text); font-size: 14px; margin-bottom: 14px;
  }
  .login-card button {
    width: 100%; padding: 11px; border: none; border-radius: 8px; background: var(--primary); color: #fff;
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .login-card button:hover { background: var(--primary-dark); }
  .login-card button:disabled { opacity: 0.6; cursor: default; }
  .login-error { color: var(--red); font-size: 13px; margin: -8px 0 14px 0; display: none; }
  .login-error.show { display: block; }
  .login-signup-link { text-align: center; font-size: 13px; color: var(--text-muted, #8a93a6); margin-top: 16px; }
  .login-signup-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
  .login-signup-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand"><img src="/logo.png" alt="" /><span>MyFinance</span></div>
    <p class="login-error" id="signupError"></p>
    <form id="signupForm">
      <input type="text" name="display_name" placeholder="Seu nome" autofocus required />
      <input type="email" name="email" placeholder="E-mail" required />
      <input type="password" name="password" placeholder="Senha (mín. 6 caracteres)" minlength="6" required />
      <button type="submit" id="signupSubmit">Criar conta</button>
    </form>
    <p class="login-signup-link">Já tem conta? <a href="/login">Entrar</a></p>
  </div>
  <script>
    var form = document.getElementById("signupForm");
    var errorEl = document.getElementById("signupError");
    var submitBtn = document.getElementById("signupSubmit");
    form.addEventListener("submit", async function (ev) {
      ev.preventDefault();
      errorEl.classList.remove("show");
      submitBtn.disabled = true;
      submitBtn.textContent = "Criando...";
      var formData = new FormData(form);
      var payload = {
        display_name: formData.get("display_name"),
        email: formData.get("email"),
        password: formData.get("password"),
      };
      try {
        var res = await fetch("/api/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (res.ok) {
          location.href = "/";
          return;
        }
        var data = await res.json().catch(function () { return {}; });
        errorEl.textContent = data.error || "Não foi possível criar a conta. Tente novamente.";
        errorEl.classList.add("show");
      } catch (e) {
        errorEl.textContent = "Erro de conexão. Tente novamente.";
        errorEl.classList.add("show");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Criar conta";
      }
    });
  </script>
</body>
</html>
